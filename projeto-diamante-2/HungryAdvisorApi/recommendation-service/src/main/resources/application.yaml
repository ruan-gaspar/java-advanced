server:
  port: 8083

spring:
  application:
    name: recommendation-service

  # DESATIVA OPENAI (evita crash do auto-config)
  ai:
    openai:
      api-key: dummy
      chat:
        enabled: false

    # OLLAMA (ativo de verdade)
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: tinyllama
          temperature: 0.4

    retry:
      max-attempts: 3
      backoff:
        initial-interval: 2s
        multiplier: 2
        max-interval: 10s

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info