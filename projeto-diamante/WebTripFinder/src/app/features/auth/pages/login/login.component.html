<main class="min-h-screen bg-gradient-to-br from-black via-zinc-900 to-slate-900 px-6 py-10 text-white">
  <div class="mx-auto flex min-h-[calc(100vh-80px)] w-full max-w-md items-center justify-center">

    <section class="w-full rounded-3xl border border-white/10 bg-white/5 backdrop-blur-xl shadow-[0_30px_80px_rgba(0,0,0,0.8)]">

      <div class="flex flex-col gap-8 px-8 py-10">

        <header class="text-center space-y-3">
          <p class="text-xs font-bold uppercase tracking-[0.25em] text-emerald-400">
            TripFinder
          </p>

          <h1 class="text-3xl font-bold">
            Explore o mundo 🌍
          </h1>

          <p class="text-sm text-zinc-400">
            Descubra lugares incríveis próximos de você.
          </p>
        </header>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">

          <div class="flex flex-col gap-2">
            <label class="text-sm text-zinc-300">Email</label>
            <input
              type="email"
              formControlName="email"
              class="rounded-xl bg-black/60 border border-white/10 px-4 py-3 text-sm text-white outline-none transition focus:border-emerald-400 focus:ring-2 focus:ring-emerald-400/20"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm text-zinc-300">Senha</label>
            <input
              type="password"
              formControlName="password"
              class="rounded-xl bg-black/60 border border-white/10 px-4 py-3 text-sm text-white outline-none transition focus:border-emerald-400 focus:ring-2 focus:ring-emerald-400/20"
            />
          </div>

          <button
            type="submit"
            class="mt-2 rounded-xl bg-gradient-to-r from-emerald-500 to-green-600 py-3 font-semibold text-white transition hover:scale-[1.02] hover:shadow-lg"
          >
            Entrar
          </button>

          <p *ngIf="errorMessage" class="text-red-400 text-sm text-center">
            {{ errorMessage }}
          </p>

        </form>
      </div>
    </section>

  </div>
</main>
