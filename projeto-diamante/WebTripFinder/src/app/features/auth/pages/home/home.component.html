<main class="min-h-screen bg-slate-950 px-6 py-10 text-white">
  <div class="mx-auto max-w-5xl">
    <header class="mb-8 flex items-center justify-between">
      <div>
        <p class="text-sm uppercase tracking-[0.2em] text-emerald-400">TripFinder</p>
        <h1 class="text-3xl font-bold">Painel inicial</h1>
      </div>

      <button
        (click)="logout()"
        class="rounded-xl border border-white/10 bg-white/5 px-4 py-2 hover:bg-white/10">
        Sair
      </button>
    </header>

    <section class="grid gap-6 md:grid-cols-3">
      <a
        routerLink="/places/search"
        class="rounded-2xl border border-white/10 bg-white/5 p-6 hover:bg-white/10">
        <h2 class="mb-2 text-xl font-semibold">Buscar lugares</h2>
        <p class="text-sm text-zinc-400">Busque por cidade ou pela sua localização.</p>
      </a>

      <a
        routerLink="/favorites"
        class="rounded-2xl border border-white/10 bg-white/5 p-6 hover:bg-white/10">
        <h2 class="mb-2 text-xl font-semibold">Favoritos</h2>
        <p class="text-sm text-zinc-400">Veja os lugares salvos.</p>
      </a>

      <a
        routerLink="/places/search"
        class="rounded-2xl border border-white/10 bg-white/5 p-6 hover:bg-white/10">
        <h2 class="mb-2 text-xl font-semibold">Explorar</h2>
        <p class="text-sm text-zinc-400">Descubra lugares próximos.</p>
      </a>
    </section>
  </div>
</main>
